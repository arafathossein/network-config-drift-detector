[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "config-drift"
version = "0.1.0"
description = "Daily network config backups, plain-English change summaries and risk flags for MikroTik, Cisco and Juniper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
ssh = ["netmiko>=4.3"]
dev = ["pytest>=8"]

[project.scripts]
config-drift = "config_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
